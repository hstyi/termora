name: Linux x86-64

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # download jdk
      - run: wget -q -O $RUNNER_TEMP/java_package.tar.gz https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-21.0.7-linux-x64-b1034.51.tar.gz

      # appimagetool
      - run: sudo apt install libfuse2

      # install jdk
      - name: Installing Java
        uses: actions/setup-java@v4
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/java_package.tar.gz
          java-version: '21.0.7'
          architecture: x64

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-

      # compile
      - name: Compile
        run: |
          docker build -t debianjbr src/test/resources/deb/
          docker run --rm -v ~/.gradle:/root/.gradle -v $(pwd):/app -w /app debianjbr ./gradlew classes -x test

      # dist
      - name: Dist
        run: |
          mkdir distributions
          
          # deb
          docker run --rm -v ~/.gradle:/root/.gradle -v $(pwd):/app -w /app debianjbr ./gradlew :dist -Dtype=deb
          sudo mv build/distributions/*.deb distributions/
          
          # clean
          docker run --rm -v ~/.gradle:/root/.gradle -v $(pwd):/app -w /app debianjbr ./gradlew clean
          
          # tar.gz and AppImage
          docker run --rm -v ~/.gradle:/root/.gradle -v $(pwd):/app -w /app debianjbr ./gradlew :dist
          sudo mv build/distributions/*.tar.gz distributions/
          sudo mv build/distributions/*.AppImage distributions/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termora-linux-x86-64
          path: |
            distributions/*.tar.gz
            distributions/*.AppImage
            distributions/*.deb
