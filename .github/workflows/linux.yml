name: Linux

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-24.04-arm, ubuntu-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradlex-

      - name: Docker build
        run: docker build -t debianjbr src/test/resources/deb/

      - name: Package
        shell: bash
        run: |
          
          DOCKER_PARAMS="docker run --rm -v $HOME/.gradle:/opt/.gradle -e GRADLE_USER_HOME=/opt/.gradle -v $(pwd):/app -w /app -u $(id -u):$(id -g)"
          
          # Compile
          $DOCKER_PARAMS debianjbr bash -c './gradlew :check-license'
          
          # Jlink
          $DOCKER_PARAMS debianjbr bash -c './gradlew :jar :copy-dependencies :plugins:migration:build :jlink'
          
          # Package Deb
          $DOCKER_PARAMS -e TERMORA_TYPE=deb debianjbr bash -c './gradlew :jpackage && ./gradlew :dist'
          
          # Package AppImage and tar.gz
          $DOCKER_PARAMS --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined debianjbr bash -c 'rm -rf build/jpackage && ./gradlew :jpackage && ./gradlew :dist'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termora-linux-${{ runner.arch }}
          path: |
            build/distributions/*.tar.gz
            build/distributions/*.AppImage
            build/distributions/*.deb
